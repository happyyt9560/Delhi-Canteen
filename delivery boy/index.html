<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Delivery Partner Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">
    <main class="login-card">
        <div class="logo-mark">DC</div>
        <p class="eyebrow">DELHI CANTEEN</p>
        <h1>Delivery Partner Login</h1>
        <p class="muted">Sign in to manage your deliveries.</p>
        <form id="login-form" novalidate><label>Phone Number<span class="input-wrap"><b>+91</b><input id="phone"
                        inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="Enter phone number"
                        aria-label="Phone number"></span></label><label>Password<span class="input-wrap"><input
                        id="password" type="password" autocomplete="current-password"
                        placeholder="Enter password"><button class="password-toggle" type="button"
                        aria-label="Show password">◉</button></span></label><button class="primary wide"
                type="submit">Login <span>→</span></button></form>
        <p class="login-help">Having trouble logging in?<br>Please contact your administrator.</p>
    </main>
    <div id="toast-area" class="toast-area" aria-live="polite"></div>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/backend-auth.js"></script>
</body>

</html>
