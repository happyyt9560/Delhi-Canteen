<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Shop Groceries | Delhi Canteen</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main id="products-page">
        <section class="filters"><a class="product-logo" href="index.html" aria-label="Delhi Canteen home"><span>दिल्ली</span><b>Canteen</b></a><div class="product-search-field"><button id="product-search-button" type="button"
                aria-label="Search products"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="m16 16 4 4"></path></svg></button><input id="product-search" type="search"
                placeholder="Search products"></div><select
                id="category-filter"></select><select id="sort-filter">
                <option value="">Sort by</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
                <option value="popular">Popular</option>
                <option value="new">New arrivals</option>
            </select><div class="product-actions"><a class="product-wishlist-button" href="wishlist.html" aria-label="My wishlist"><svg class="product-wishlist-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.2 10.55 20C5.4 15.7 2 12.85 2 9.35 2 6.5 4.25 4.3 7.1 4.3c1.62 0 3.18.76 4.18 1.96a5.45 5.45 0 0 1 4.18-1.96c2.85 0 5.1 2.2 5.1 5.05 0 3.5-3.4 6.35-8.55 10.66L12 21.2Z"></path></svg><span class="product-wishlist-label">Wishlist</span></a><a href="orders.html">Orders</a><a class="product-cart-button"
                    href="cart.html" aria-label="Shopping cart"><svg class="product-cart-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8Z"></path><path d="M9 9V6a3 3 0 0 1 6 0v3"></path></svg><span class="product-cart-label">Cart</span><b class="cart-count">0</b></a></div></section>
        <section class="section product-grid" id="product-grid"></section>
    </main>
    <script src="js/app.js"></script><script src="js/api.js"></script>
</body>

</html>
