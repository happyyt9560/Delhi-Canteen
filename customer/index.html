<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Delhi Canteen — fresh groceries delivered across Delhi.">
  <title>Delhi Canteen </title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main>
    <section class="hero hero-slider" id="hero-slider" aria-roledescription="carousel" aria-label="Featured offers">
      <div class="slider-dots" aria-label="Banner navigation"><button class="active" type="button"
          aria-label="Show banner 1"></button><button type="button" aria-label="Show banner 2"></button><button
          type="button" aria-label="Show banner 3"></button><button type="button" aria-label="Show banner 4"></button>
      </div>
    </section>
    <section class="section">
      <div class="section-head">
        <div>
          <p class="eyebrow">SHOP BY AISLE</p>
          <h2>Everything you need</h2>
        </div><a href="products.html">View all &rarr;</a>
      </div>
      <div class="category-grid" id="category-cards">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
    </section>
    <section class="section">
      <div class="section-head">
        <div>
          <p class="eyebrow">MOST LOVED</p>
          <h2>Best selling products</h2>
        </div>
      </div>
      <div class="product-grid" id="featured-products"></div>
    </section>
    <div id="category-product-sections"></div>
    <section class="offer">
      <p class="eyebrow">DELHI CANTEEN SAVINGS</p>
      <h2>Save more on your<br>everyday basket.</h2>
      <p>Enjoy up to 25% off on handpicked staples, fruits and vegetables.</p><a class="primary"
        href="products.html">Explore offers</a>
    </section>
  </main>
  <script src="js/app.js"></script><script src="js/api.js"></script>
</body>

</html>
